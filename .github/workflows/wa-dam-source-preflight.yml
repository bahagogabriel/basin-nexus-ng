name: Independent 2026 West Africa dam-source intake QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/preflight_wa_dams_2026.py'
      - 'tools/review_wa_dam_catchments_2026.py'
      - 'tools/review_wa_dam_identity_2026.py'
      - 'tools/build_wa_2026_dam_candidate_review.py'
      - 'tools/triage_wa_dam_compiled_references.py'
      - 'tools/build_stage3d_u_evidence_workbench.py'
      - 'tools/build_stage3d_v_osm_context_review.py'
      - 'tools/build_stage3d_w_lineage_eo_discovery.py'
      - 'tools/build_stage3d_xy_sentinel_pixel_review.py'
      - 'tools/build_stage3d_aa_ad_evidence_reconciliation.py'
      - 'tools/test_stage3d_aa_ad_evidence_reconciliation.py'
      - 'tools/test_stage3d_xy_sentinel_pixel_review.py'
      - 'tools/test_stage3d_w_lineage_eo_discovery.py'
      - 'tools/test_stage3d_v_osm_context_review.py'
      - 'tools/test_stage3d_u_evidence_workbench.py'
      - 'tools/test_triage_wa_dam_compiled_references.py'
      - 'tools/test_build_wa_2026_dam_candidate_review.py'
      - 'tools/test_review_wa_dam_identity_2026.py'
      - 'tools/test_review_wa_dam_catchments_2026.py'
      - 'tools/test_preflight_wa_dams_2026.py'
      - 'site/data/external_reference_sources.json'
      - '.github/workflows/wa-dam-source-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'tools/preflight_wa_dams_2026.py'
      - 'tools/review_wa_dam_catchments_2026.py'
      - 'tools/review_wa_dam_identity_2026.py'
      - 'tools/build_wa_2026_dam_candidate_review.py'
      - 'tools/triage_wa_dam_compiled_references.py'
      - 'tools/build_stage3d_u_evidence_workbench.py'
      - 'tools/build_stage3d_v_osm_context_review.py'
      - 'tools/build_stage3d_w_lineage_eo_discovery.py'
      - 'tools/build_stage3d_xy_sentinel_pixel_review.py'
      - 'tools/build_stage3d_aa_ad_evidence_reconciliation.py'
      - 'tools/test_stage3d_aa_ad_evidence_reconciliation.py'
      - 'tools/test_stage3d_xy_sentinel_pixel_review.py'
      - 'tools/test_stage3d_w_lineage_eo_discovery.py'
      - 'tools/test_stage3d_v_osm_context_review.py'
      - 'tools/test_stage3d_u_evidence_workbench.py'
      - 'tools/test_triage_wa_dam_compiled_references.py'
      - 'tools/test_build_wa_2026_dam_candidate_review.py'
      - 'tools/test_review_wa_dam_identity_2026.py'
      - 'tools/test_review_wa_dam_catchments_2026.py'
      - 'site/data/external_reference_sources.json'
      - '.github/workflows/wa-dam-source-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned GIS validation dependencies
        run: python -m pip install --disable-pip-version-check shapely==2.1.2 pyproj==3.7.2
      - name: Synthetic source-safety preflight tests
        run: |
          python tools/test_external_reference_sources.py
          python -m unittest discover -s tools -p 'test_preflight_wa_dams_2026.py' -v
          python -m unittest discover -s tools -p 'test_review_wa_dam_catchments_2026.py' -v
          python -m unittest discover -s tools -p 'test_review_wa_dam_identity_2026.py' -v
          python -m unittest discover -s tools -p 'test_build_wa_2026_dam_candidate_review.py' -v
          python -m unittest discover -s tools -p 'test_triage_wa_dam_compiled_references.py' -v
          python -m unittest discover -s tools -p 'test_stage3d_u_evidence_workbench.py' -v
          python -m unittest discover -s tools -p 'test_stage3d_v_osm_context_review.py' -v
          python -m unittest discover -s tools -p 'test_stage3d_w_lineage_eo_discovery.py' -v
          python -m unittest discover -s tools -p 'test_stage3d_xy_sentinel_pixel_review.py' -v
          python -m unittest discover -s tools -p 'test_stage3d_aa_ad_evidence_reconciliation.py' -v
      - name: Fetch pinned 2026 bonndata dam CSV and report aggregate QA only
        if: github.event_name != 'pull_request'
        run: python tools/preflight_wa_dams_2026.py --fetch --report review/wa_dams_2026_preflight.json
      - name: Verify original WGS84 source geometry and calculate candidate catchment overlap counts
        if: github.event_name != 'pull_request'
        run: python tools/review_wa_dam_catchments_2026.py --fetch --catchments site/data/catchments.geojson --report review/wa_dams_2026_candidate_catchment_qa.json
      - name: Audit 2026 dam source identity, provenance and nearby positions without point export
        if: github.event_name != 'pull_request'
        run: python tools/review_wa_dam_identity_2026.py --fetch --catchments site/data/catchments.geojson --report review/wa_dams_2026_identity_source_qa.json
      - name: Prepare inspectable compiled reference candidates from pinned original source
        if: github.event_name != 'pull_request'
        run: python tools/build_wa_2026_dam_candidate_review.py --fetch --catchments site/data/catchments.geojson --review-output review/compiled_wa_dam_candidates_NOT_VERIFIED.json
      - name: Stage 3D-T source-only proximity and identity triage (no facility confirmation)
        if: github.event_name != 'pull_request'
        run: python tools/triage_wa_dam_compiled_references.py --candidate-artifact review/compiled_wa_dam_candidates_NOT_VERIFIED.json --review-output review/wa_dam_reference_triage_NOT_CONFIRMED.json
      - name: Stage 3D-U generate high-priority reviewer-only evidence workbench
        if: github.event_name != 'pull_request'
        run: python tools/build_stage3d_u_evidence_workbench.py --triage review/wa_dam_reference_triage_NOT_CONFIRMED.json --review-output review/wa_dam_stage3d_u_19_case_NOT_VERIFIED.json
      - name: Stage 3D-V compare 19 research-only compiled reference locations to OSM tags
        if: github.event_name != 'pull_request'
        run: python tools/build_stage3d_v_osm_context_review.py --workbench review/wa_dam_stage3d_u_19_case_NOT_VERIFIED.json --fetch-osm --report review/stage3d_v_osm_context_NOT_CONFIRMED.json
      - name: Stage 3D-W check five OSM way histories and discover dated Sentinel-2 scene metadata
        if: github.event_name != 'pull_request'
        run: python tools/build_stage3d_w_lineage_eo_discovery.py --stage-u review/wa_dam_stage3d_u_19_case_NOT_VERIFIED.json --stage-v review/stage3d_v_osm_context_NOT_CONFIRMED.json --output review/stage3d_w_lineage_eo_METADATA_NOT_CONFIRMED.json
      - name: Install pinned windowed raster, image and numeric runtime for main-only imagery
        if: github.event_name != 'pull_request'
        run: python -m pip install --disable-pip-version-check rasterio==1.4.3 numpy==2.2.6 Pillow==11.3.0
      - name: Stage 3D-X/Y sample bounded Sentinel-2 RGB + SCL pixels and generate reviewer board
        if: github.event_name != 'pull_request'
        timeout-minutes: 18
        run: python tools/build_stage3d_xy_sentinel_pixel_review.py --stage-w review/stage3d_w_lineage_eo_METADATA_NOT_CONFIRMED.json --output-dir review/stage3d_xy_rgb_scl_REVIEW_ONLY
      - name: Stages 3D-AA to AD reconcile OSM polyline geometry, documentary source positions and optical review receipts
        if: github.event_name != 'pull_request'
        timeout-minutes: 6
        run: python tools/build_stage3d_aa_ad_evidence_reconciliation.py --stage-u review/wa_dam_stage3d_u_19_case_NOT_VERIFIED.json --stage-v review/stage3d_v_osm_context_NOT_CONFIRMED.json --stage-w review/stage3d_w_lineage_eo_METADATA_NOT_CONFIRMED.json --stage-z review/stage3d_xy_rgb_scl_REVIEW_ONLY/stage3d_xy_pixel_qa_NOT_CONFIRMED.json --output review/stage3d_aa_ad_evidence_REVIEW_ONLY
      - name: Archive separately attributed geospatial and government-document evidence receipts, not confirmed
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: basin-nexus-stage3daa-ad-geometry-government-SCL-evidence-REVIEW-ONLY
          path: review/stage3d_aa_ad_evidence_REVIEW_ONLY/
          if-no-files-found: error
          retention-days: 60
      - name: Archive Stage 3D-X/Y review-only RGB/SCL chip QA and human reviewer board
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: basin-nexus-stage3dx-y-sentinel-pixels-REVIEW-ONLY
          path: review/stage3d_xy_rgb_scl_REVIEW_ONLY/
          if-no-files-found: error
          retention-days: 30
      - name: Archive source-separated history and EO metadata candidates; no facility verification
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: west-africa-2026-osm-lineage-sentinel-scene-METADATA-NOT-CONFIRMED
          path: review/stage3d_w_lineage_eo_METADATA_NOT_CONFIRMED.json
          if-no-files-found: error
      - name: Archive separately attributed OSM research leads, never public map features
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: west-africa-2026-osm-context-NOT-CONFIRMED
          path: review/stage3d_v_osm_context_NOT_CONFIRMED.json
          if-no-files-found: error
      - name: Archive non-public 19-case contextual evidence review packet
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: west-africa-2026-19-case-evidence-workbench-NOT-CONFIRMED
          path: review/wa_dam_stage3d_u_19_case_NOT_VERIFIED.json
          if-no-files-found: error
      - name: Archive reviewer-only triage queue; never the public site directory
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: west-africa-2026-source-review-triage-NOT-CONFIRMED
          path: review/wa_dam_reference_triage_NOT_CONFIRMED.json
          if-no-files-found: error
      - name: Archive CC BY 4.0 compiled reference candidates for further review; NOT verified
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: west-africa-2026-public-source-research-candidates-unverified
          path: review/compiled_wa_dam_candidates_NOT_VERIFIED.json
          if-no-files-found: error
      - name: Archive aggregate-only source QA report; never archive raw CSV or coordinates
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: west-africa-2026-dam-source-aggregate-qa
          path: |
            review/wa_dams_2026_preflight.json
            review/wa_dams_2026_candidate_catchment_qa.json
            review/wa_dams_2026_identity_source_qa.json
          if-no-files-found: warn
