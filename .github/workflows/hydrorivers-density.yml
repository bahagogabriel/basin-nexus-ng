name: HydroRIVERS detailed river density preflight — no publication
on:
  push:
    branches: [main]
    paths:
      - 'tools/preflight_hydrorivers.py'
      - '.github/workflows/hydrorivers-density.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  density:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only spatial inspection tools
        run: python -m pip install 'pyogrio>=0.10,<1' 'geopandas>=1.0,<2' 'shapely>=2.0,<3' 'requests>=2.31,<3'
      - name: Assess Africa river density without redistributing geometry
        run: python tools/preflight_hydrorivers.py
      - name: Upload aggregate results only — no source geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basin-nexus-hydrorivers-density-license-review
          path: review/hydrorivers-licensing-qa/density_and_license_hold.json
          if-no-files-found: warn
