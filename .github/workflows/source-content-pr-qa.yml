name: Stage S2 source-content and privacy PR QA
on:
  pull_request:
    paths:
      - 'site/index.html'
      - 'site/data/stakeholder_coverage_index.json'
      - 'site/data/source_content_publication_model.json'
      - 'site/data/public_lga_occurrences.json'
      - 'tools/test_public_lga_occurrences.py'
      - 'site/data/public_evidence_catalogue.json'
      - 'tools/validate_public_release.py'
      - 'tools/test_stage_s2_source_content_model.py'
      - 'tools/test_public_knowledge_index.py'
      - 'tools/test_engagement_source_contract.py'
      - '.github/workflows/source-content-pr-qa.yml'
permissions:
  contents: read
jobs:
  validate-source-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser JavaScript syntax
        run: python tools/check_browser_js.py
      - name: Verify 20-source index and original-topic links
        run: python tools/test_public_knowledge_index.py
      - name: Verify metadata-only S2 model
        run: python tools/test_stage_s2_source_content_model.py
      - name: Test source-data adversarial privacy contract
        run: python -m unittest discover -s tools -p 'test_engagement_source_contract.py' -v
      - name: Check public LGA-level stakeholder occurrence geometry and disclosure
        run: python tools/test_public_lga_occurrences.py
      - name: Check downstream public evidence zero-record gate
        run: python tools/test_public_evidence_catalogue.py
