name: Basin Nexus geographic layer browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'tools/ui_smoke_v09.cjs'
      - 'tools/test_knowledge_reference_explorer.py'
      - 'tools/test_thematic_lenses.py'
      - 'tools/test_public_evidence_catalogue.py'
      - 'tools/evidence_publication_gate.py'
      - 'tools/test_hardened_evidence_gate.py'
      - 'tools/stage3d_e_release_pipeline.py'
      - 'tools/stage3d_f_editorial_workbench.py'
      - 'tools/test_stage3d_f_editorial_workbench.py'
      - 'tools/stage3d_g_priority_queue.py'
      - 'tools/test_stage3d_g_priority_queue.py'
      - 'tools/stage3d_k_provenance_triage.py'
      - 'tools/test_stage3d_k_provenance_triage.py'
      - 'tools/test_stage3d_e_release_pipeline.py'
      - 'site/data/public_evidence_catalogue.json'
      - 'site/data/confirmed_dam_sites.json'
      - 'tools/validate_confirmed_dam_sites.py'
      - 'tools/test_validate_confirmed_dam_sites.py'
      - 'site/data/wa_dam_compiled_reference_preview.json'
      - 'tools/test_compiled_dam_preview.py'
      - 'tools/build_wa_2026_dam_candidate_review.py'
      - 'tools/test_build_wa_2026_dam_candidate_review.py'
      - 'tools/triage_wa_dam_compiled_references.py'
      - 'tools/build_stage3d_u_evidence_workbench.py'
      - 'tools/build_stage3d_v_osm_context_review.py'
      - 'tools/build_stage3d_w_lineage_eo_discovery.py'
      - 'tools/build_stage3d_xy_sentinel_pixel_review.py'
      - 'tools/test_stage3d_xy_sentinel_pixel_review.py'
      - 'tools/test_stage3d_w_lineage_eo_discovery.py'
      - 'tools/test_stage3d_v_osm_context_review.py'
      - 'tools/test_stage3d_u_evidence_workbench.py'
      - 'tools/test_triage_wa_dam_compiled_references.py'
      - 'site/data/external_reference_sources.json'
      - 'tools/preflight_wa_dams_2026.py'
      - 'tools/test_preflight_wa_dams_2026.py'
      - 'tools/test_external_reference_sources.py'
      - 'site/data/wa_dams_2026_catchment_reference_counts.json'
      - 'tools/test_wa_dam_reference_counts.py'
      - 'tools/test_wa_dam_source_quality.py'
      - 'site/data/wa_dams_2026_source_quality.json'
      - '.github/workflows/wa-dam-source-preflight.yml'
      - 'tools/stage3c_private_editorial_qa.py'
      - 'tools/stage3c_source_context_qa.py'
      - 'tools/test_stage3c_source_context_qa.py'
      - 'tools/test_stage3c_private_editorial_qa.py'
      - '.github/workflows/ui-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/data/adm1_states_provisional.geojson'
      - 'site/data/adm2_lgas_study_provisional.geojson'
      - 'site/data/admin_crosswalk_provisional.json'
      - 'site/data/rivers_overview.geojson'
      - 'site/data/lakes_overview.geojson'
      - 'site/data/hydro_reference_metadata.json'
      - 'tools/ui_smoke_v09.cjs'
      - 'tools/triage_wa_dam_compiled_references.py'
      - 'tools/build_stage3d_u_evidence_workbench.py'
      - 'tools/build_stage3d_v_osm_context_review.py'
      - 'tools/build_stage3d_w_lineage_eo_discovery.py'
      - 'tools/build_stage3d_xy_sentinel_pixel_review.py'
      - 'tools/test_stage3d_xy_sentinel_pixel_review.py'
      - 'tools/test_stage3d_w_lineage_eo_discovery.py'
      - 'tools/test_stage3d_v_osm_context_review.py'
      - 'tools/test_stage3d_u_evidence_workbench.py'
      - 'tools/test_triage_wa_dam_compiled_references.py'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Install pinned WGS84 source-comparison test dependency
        run: python3 -m pip install --disable-pip-version-check pyproj==3.7.2
      - name: Verify Stage 3C-B editorial privacy guardrails (synthetic)
        run: python3 -m unittest discover -s tools -p 'test_stage3c_private_editorial_qa.py' -v
      - name: Verify private source-context integrity (synthetic only)
        run: python3 -m unittest discover -s tools -p 'test_stage3c_source_context_qa.py' -v
      - name: Check public engagement metadata contract
        run: python3 tools/test_public_knowledge_index.py
      - name: Guard published geographic/river reference counts and privacy
        run: python3 tools/test_knowledge_reference_explorer.py
      - name: Verify source-safe thematic hierarchy and cross-border analysis
        run: python3 tools/test_thematic_lenses.py
      - name: Validate public empty evidence catalogue
        run: python3 tools/test_public_evidence_catalogue.py
      - name: Verify hardened publication and reviewer-receipt safeguards (synthetic only)
        run: |
          python3 -m unittest discover -s tools -p 'test_hardened_evidence_gate.py' -v
          python3 -m unittest discover -s tools -p 'test_stage3d_e_release_pipeline.py' -v
      - name: Guard Stage 3D-F/G private source workbenches (synthetic only)
        run: |
          python3 -m unittest discover -s tools -p 'test_stage3d_f_editorial_workbench.py' -v
          python3 -m unittest discover -s tools -p 'test_stage3d_g_priority_queue.py' -v
      - name: Verify Stage 3D-K independence and historical source interpretation (synthetic only)
        run: python3 -m unittest discover -s tools -p 'test_stage3d_k_provenance_triage.py' -v
      - name: Validate third-party source registry and pinned CSV schema with synthetic data
        run: |
          python3 tools/test_external_reference_sources.py
          python3 -m unittest discover -s tools -p 'test_preflight_wa_dams_2026.py' -v
      - name: Guard public aggregate 2026 dam reference counts and zero point disclosure
        run: python tools/test_wa_dam_reference_counts.py
      - name: Verify public compiled 2026 dam source-name and source-year completeness
        run: python tools/test_wa_dam_source_quality.py
      - name: Guard confirmed unnamed dams and synthetic independently reviewed admission receipts
        run: |
          python3 tools/validate_confirmed_dam_sites.py
          python3 -m unittest discover -s tools -p 'test_validate_confirmed_dam_sites.py' -v
      - name: Guard opt-in compiled reference points, quarantines and zero confirmed dams
        run: python3 tools/test_compiled_dam_preview.py
      - name: Guard Stage 3D-U high-priority evidence worksheet (synthetic only)
        run: python3 -m unittest discover -s tools -p 'test_stage3d_u_evidence_workbench.py' -v
      - name: Guard Stage 3D-V OSM source comparison and privacy (synthetic only)
        run: python3 -m unittest discover -s tools -p 'test_stage3d_v_osm_context_review.py' -v
      - name: Guard Stage 3D-W source lineage and satellite-metadata non-confirmation (synthetic)
        run: python3 -m unittest discover -s tools -p 'test_stage3d_w_lineage_eo_discovery.py' -v
      - name: Guard Stage 3D-X/Y pixel QA provenance and no dam verification (synthetic only)
        run: python3 -m unittest discover -s tools -p 'test_stage3d_xy_sentinel_pixel_review.py' -v
      - name: Run desktop and tablet map interaction and pinch QA
        run: node tools/ui_smoke_v09.cjs
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basin-nexus-browser-v09-qa
          path: review/browser-v09/
          if-no-files-found: warn
