name: Basin Nexus geographic layer browser QA
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/data/adm1_states_provisional.geojson'
      - 'site/data/adm2_lgas_study_provisional.geojson'
      - 'site/data/admin_crosswalk_provisional.json'
      - 'tools/ui_smoke_v08.cjs'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile boundary-map tests
        run: node tools/ui_smoke_v08.cjs
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basin-nexus-browser-v08-qa
          path: review/browser-v08/
          if-no-files-found: warn
