name: Basin Nexus geographic layer browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'tools/ui_smoke_v09.cjs'
      - 'tools/test_knowledge_reference_explorer.py'
      - 'tools/test_thematic_lenses.py'
      - 'tools/stage3c_private_editorial_qa.py'
      - 'tools/stage3c_source_context_qa.py'
      - 'tools/test_stage3c_source_context_qa.py'
      - 'tools/test_stage3c_private_editorial_qa.py'
      - '.github/workflows/ui-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/data/adm1_states_provisional.geojson'
      - 'site/data/adm2_lgas_study_provisional.geojson'
      - 'site/data/admin_crosswalk_provisional.json'
      - 'site/data/rivers_overview.geojson'
      - 'site/data/lakes_overview.geojson'
      - 'site/data/hydro_reference_metadata.json'
      - 'tools/ui_smoke_v09.cjs'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify Stage 3C-B editorial privacy guardrails (synthetic)
        run: python3 -m unittest discover -s tools -p 'test_stage3c_private_editorial_qa.py' -v
      - name: Verify private source-context integrity (synthetic only)
        run: python3 -m unittest discover -s tools -p 'test_stage3c_source_context_qa.py' -v
      - name: Check public engagement metadata contract
        run: python3 tools/test_public_knowledge_index.py
      - name: Guard published geographic/river reference counts and privacy
        run: python3 tools/test_knowledge_reference_explorer.py
      - name: Verify source-safe thematic hierarchy and cross-border analysis
        run: python3 tools/test_thematic_lenses.py
      - name: Run desktop and tablet map interaction and pinch QA
        run: node tools/ui_smoke_v09.cjs
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basin-nexus-browser-v09-qa
          path: review/browser-v09/
          if-no-files-found: warn
