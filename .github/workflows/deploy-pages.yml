name: Validate and deploy Basin Nexus NG
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Build water geography reference layers, Generate provisional state and LGA map layers]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned FAO study-area geometry screening dependency
        run: python -m pip install --disable-pip-version-check 'shapely==2.1.2' 'pyproj==3.7.2'
      - name: Verify public-release allowlist and geometry records
        run: python tools/validate_public_release.py
      - name: Validate public-only external research source registry and synthetic CSV integrity
        run: |
          python tools/test_external_reference_sources.py
          python -m unittest discover -s tools -p 'test_preflight_wa_dams_2026.py' -v
      - name: Verify scientific 2026 dam source count aggregation and attribution
        run: python tools/test_wa_dam_reference_counts.py
      - name: Verify public compiled dam-reference name/provenance/year completeness
        run: python tools/test_wa_dam_source_quality.py
      - name: Enforce zero confirmed facility records until actual individual reviews exist
        run: |
          python tools/validate_confirmed_dam_sites.py
          python -m unittest discover -s tools -p 'test_validate_confirmed_dam_sites.py' -v
      - name: Validate licensed 186 source research preview and three withheld identities
        run: python tools/test_compiled_dam_preview.py
      - name: Verify international context screening
        run: python tools/test_country_context.py
      - name: Verify provisional public administrative catalogue
        run: python tools/test_public_admin_catalogue.py
      - name: Check browser JavaScript syntax
        run: python tools/check_browser_js.py
      - name: Check independent NASA climate Javascript and original 20-point sources
        run: |
          python -m unittest discover -s tools -p 'test_stage3d_bo_br_power_climate.py' -v
      - name: Verify Canvas map and gesture regression
        run: python tools/test_canvas_map_v09.py
      - name: Guard Canvas position and idle-render regression
        run: python tools/test_canvas_drift.py
      - name: Verify coarse river and lake publication policy
        run: python tools/test_public_hydro_overview.py
      - name: Guard LGA and water feature click precedence
        run: python tools/test_hydro_lga_click_priority.py
      - name: Guard cross-catchment water popup state
        run: python tools/test_hydro_popup_reset.py
      - name: Verify selected-catchment river view and honest coverage labels
        run: python tools/test_river_focus.py
      - name: Verify detailed catchment river network and renderer
        run: python tools/test_detailed_rivers.py
      - name: Verify 20 catchment FAO reach comparison JSON, CSV and disclaimers
        run: python -m unittest discover -s tools -p 'test_stage3d_aq_at_river_comparison.py' -v
      - name: Verify source-only FAO NEXT_DOWN reach relationships and source identity integrity
        run: python -m unittest discover -s tools -p 'test_stage3d_au_av_fao_topology.py' -v
      - name: Verify original modeled clip endpoint QA and unsurveyed connection disclaimers
        run: python -m unittest discover -s tools -p 'test_stage3d_ay_az_fao_endpoint_qa.py' -v
      - name: Verify FAO uncut 2026 publisher model junctions and three publisher/provenance-safe case claims
        run: |
          python -m unittest discover -s tools -p 'test_stage3d_bc_original_uncut_fao_review.py' -v
          python -m unittest discover -s tools -p 'test_stage3d_bd_bf_uncut_source_resolution.py' -v
      - name: Verify all 89 crosscatchment source associations and study polygon overlap without inferring flows
        run: python -m unittest discover -s tools -p 'test_stage3d_bg_bj_89_boundary_qa.py' -v
      - name: Verify original SCMP overlap area, 125 FAO source boundary-screen records and zero true outlet claims
        run: python -m unittest discover -s tools -p 'test_stage3d_bk_bn_overlap_outlet_screen.py' -v
      - name: Verify UX-A grouped controls and adaptive layout
        run: python tools/test_ux_a.py
      - name: Set up Node for browser usability checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check climate explorer syntax
        run: node --check site/climate.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify regional-first launch and selection policy
        run: python tools/test_regional_launch.py
      - name: Verify desktop, tablet and phone usability before publishing
        run: node tools/ui_smoke_v09.cjs
      - name: Archive reviewed interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basin-nexus-v14-release-browser-qa
          path: review/browser-v09/
          if-no-files-found: warn
      - name: Verify map-first homepage and phone-first explorer
        run: python tools/test_map_first.py
      - name: Verify directory selection, profile navigation and map hints
        run: python tools/test_profile_discovery.py
      - name: Validate knowledge source coverage and publishing policy
        run: python tools/test_public_knowledge_index.py
      - name: Reject unsanctioned institutional claims and confidential fields in public source index
        run: python -m unittest discover -s tools -p 'test_engagement_source_contract.py' -v
      - name: Validate public geographic and modeled-water reference counts
        run: python tools/test_knowledge_reference_explorer.py
      - name: Verify thematic model hierarchy and evidence-readiness policy
        run: python tools/test_thematic_lenses.py
      - name: Verify public catalogue is approved-only and empty for this release
        run: python tools/test_public_evidence_catalogue.py
      - name: Verify source-rights and record fingerprint review gates (synthetic only)
        run: |
          python -m unittest discover -s tools -p 'test_hardened_evidence_gate.py' -v
          python -m unittest discover -s tools -p 'test_stage3d_e_release_pipeline.py' -v
      - name: Test future evidence publication safeguards
        run: python tools/test_evidence_publication_gate.py
      - name: Test Stage 3B private-review synthetic QA
        run: python -m unittest discover -s tools -p 'test_stage3b_private_qa.py' -v
      - name: Test Stage 3C-B private editorial safeguards (synthetic only)
        run: python -m unittest discover -s tools -p 'test_stage3c_private_editorial_qa.py' -v
      - name: Test Stage 3C-C source-context pairing privacy (synthetic only)
        run: python -m unittest discover -s tools -p 'test_stage3c_source_context_qa.py' -v
      - name: Test Stage 3D-F/G private editorial workbench and high-priority line review
        run: |
          python -m unittest discover -s tools -p 'test_stage3d_f_editorial_workbench.py' -v
          python -m unittest discover -s tools -p 'test_stage3d_g_priority_queue.py' -v
      - name: Guard Stage 3D-K provenance and date-scope safety (synthetic only)
        run: python -m unittest discover -s tools -p 'test_stage3d_k_provenance_triage.py' -v
      - name: Guard signed-source classification and numeric reconciliation
        run: python -m unittest discover -s tools -p 'test_stage3b_source_integrity.py' -v
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
