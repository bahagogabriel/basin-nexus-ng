name: Validate and deploy Basin Nexus NG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public-release allowlist and geometry records
        run: python tools/validate_public_release.py
      - name: Guard map click and drag regression
        run: python tools/test_map_interaction.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
