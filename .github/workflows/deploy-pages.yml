name: Validate and deploy Basin Nexus NG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public-release allowlist and geometry records
        run: python tools/validate_public_release.py
      - name: Verify international context screening
        run: python tools/test_country_context.py
      - name: Verify provisional public administrative catalogue
        run: python tools/test_public_admin_catalogue.py
      - name: Check browser JavaScript syntax
        run: python tools/check_browser_js.py
      - name: Verify Canvas map and gesture regression
        run: python tools/test_canvas_map_v09.py
      - name: Guard Canvas position and idle-render regression
        run: python tools/test_canvas_drift.py
      - name: Verify coarse river and lake publication policy
        run: python tools/test_public_hydro_overview.py
      - name: Guard LGA and water feature click precedence
        run: python tools/test_hydro_lga_click_priority.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
